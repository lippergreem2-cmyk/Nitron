<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product - NitronStore</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<div class="logo">
NitronStore
</div>

<nav>
<a href="index.html">Home</a>
<a href="#">Shop</a>
<a href="#">Collections</a>
</nav>

</header>



<section id="product-page">

<div id="product-image"></div>


<div id="product-info">

<h1 id="name"></h1>

<h2 id="price"></h2>

<p id="description"></p>


<label>
Size:
</label>

<select id="size">
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>



<label>
Color:
</label>

<select id="color">
<option>Black</option>
<option>White</option>
</select>


<br><br>

<button>
Add To Cart
</button>


<button>
Buy Now
</button>


</div>

</section>



<script src="js/product.js"></script>


</body>

</html>
