<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nitron</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; margin: 0; padding: 0; }
  #chat { max-width: 600px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
  h1 { font-size: 20px; text-align: center; }
  #messages { flex: 1; overflow-y: auto; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .msg { margin-bottom: 10px; line-height: 1.4; white-space: pre-wrap; }
  .user { color: #8ab4f8; }
  .nitron { color: #a5d6a7; }
  #inputRow { display: flex; gap: 8px; }
  #textInput { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #1c1c1c; color: #eee; }
  #sendBtn { padding: 10px 16px; border-radius: 6px; border: none; background: #4285f4; color: white; }
</style>
</head>
<body>
<div id="chat">
  <h1>Nitron</h1>
  <div id="messages"></div>
  <div id="inputRow">
    <input id="textInput" type="text" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</div>
<script>
const messages = document.getElementById("messages");
const input = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = (who === "user" ? "You: " : "Nitron: ") + text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, "user");
  input.value = "";

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    addMessage(data.reply || data.error || "No response.", "nitron");
  } catch (err) {
    addMessage("Connection error: " + err, "nitron");
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>
</body>
</html>
